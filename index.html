<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Личные финансы офлайн: бюджет, цели и конверты. Данные остаются на вашем устройстве."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Конверкот" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Конверкот: бюджет, цели и конверты" />
    <meta
      property="og:description"
      content="Сколько откладывать на каждую цель, хватает ли бюджета и сколько налога вернуть. Бесплатно, без регистрации, данные остаются на вашем устройстве."
    />
    <meta property="og:url" content="__SITE_ORIGIN__/" />
    <meta property="og:image" content="__SITE_ORIGIN__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Конверкот: бюджет, цели и конверты" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Конверкот</title>
    <script>
      // The theme is applied before the first paint, otherwise a light-theme user sees
      // a dark page flash by while the application boots.
      (function () {
        try {
          var stored = localStorage.getItem('konvert-me.theme');
          var dark = stored !== 'light';
          document.documentElement.classList.toggle('dark', dark);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#000000' : '#ffffff');
        } catch (error) {
          // blocked storage: the dark theme of the markup stays
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
